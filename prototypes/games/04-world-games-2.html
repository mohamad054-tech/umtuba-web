<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMTUBA World — الدفعة الثانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --field:#0C2723; --surface:#14352F; --raise:#1B443C; --line:#255A50;
  --ink:#EAF2EE; --muted:#8FB3AA; --gold:#F0A93B; --gold-dim:#9A6E22;
  --clay:#D46A5E; --mint:#5FCBA4; --r:14px; --pad:clamp(14px,3.5vw,26px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--field);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:400;line-height:1.65;
  -webkit-font-smoothing:antialiased;padding:var(--pad);display:flex;justify-content:center;
}
.app{width:100%;max-width:760px}
.masthead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.mark{font-weight:700;font-size:clamp(21px,4.6vw,27px);letter-spacing:-.015em}
.mark span{color:var(--gold)}
.sub{color:var(--muted);font-size:14px;font-weight:300}
.rule{height:1px;background:var(--line);margin:18px 0 20px}
.surfaces{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.surf{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:14px;font-weight:500;padding:8px 15px;border-radius:999px;
  cursor:pointer;transition:color .15s,border-color .15s,background .15s;
}
.surf:hover{color:var(--ink);border-color:var(--gold-dim)}
.surf[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#14261C;font-weight:600}
.surf:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.where{color:var(--muted);font-size:13px;font-weight:300;margin:12px 0 20px}
.where b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bar{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.25}
.stat .k{font-size:11px;color:var(--muted);font-weight:300}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.warn{color:var(--clay)}
.grow{flex:1}
.strand{height:3px;background:var(--raise);position:relative;overflow:hidden}
.strand i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold);width:0;transition:width .25s linear}
.strand i.tight{background:var(--clay)}
.body{padding:clamp(16px,4vw,24px)}
button.btn{
  font:inherit;font-weight:600;font-size:15px;border-radius:10px;cursor:pointer;
  padding:11px 20px;border:1px solid var(--line);background:var(--raise);color:var(--ink);
  transition:background .15s,border-color .15s;
}
button.btn:hover{border-color:var(--gold-dim)}
button.btn.go{background:var(--gold);border-color:var(--gold);color:#14261C}
button.btn.go:hover{background:#F6B64F}
button.btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.qnum{font-size:12px;color:var(--muted);font-weight:300;margin-bottom:8px}
.qtext{font-size:clamp(17px,3.6vw,21px);font-weight:600;line-height:1.5;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  font:inherit;font-size:15px;text-align:start;cursor:pointer;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:12px;
  transition:border-color .15s,background .15s;
}
.choice:hover:not(:disabled){border-color:var(--gold-dim)}
.choice:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.choice .tag{
  width:26px;height:26px;flex:none;border-radius:7px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)
}
.choice.right{border-color:var(--mint);background:rgba(95,203,164,.13)}
.choice.right .tag{background:var(--mint);color:#0C2723;border-color:var(--mint)}
.choice.wrong{border-color:var(--clay);background:rgba(212,106,94,.13)}
.choice.wrong .tag{background:var(--clay);color:#2A1614;border-color:var(--clay)}
.choice:disabled{cursor:default}
.why{
  margin-top:16px;padding:14px 16px;border-radius:11px;
  background:var(--field);border:1px solid var(--line);font-size:14.5px;line-height:1.7
}
.why .lead{font-weight:600;display:block;margin-bottom:3px}
.why.ok .lead{color:var(--mint)}
.why.no .lead{color:var(--clay)}
.flagbox{
  background:var(--field);border:1px solid var(--line);border-radius:11px;
  padding:18px;display:grid;place-items:center;margin-bottom:16px;
}
.flagbox svg{width:min(100%,280px);height:auto;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.pairgrid{grid-template-columns:1fr}}
.paircard{
  font:inherit;text-align:start;cursor:pointer;background:var(--raise);
  border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:14px 15px;
}
.paircard:hover:not(:disabled){border-color:var(--gold-dim)}
.paircard:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.paircard .who{font-weight:600;font-size:15px}
.paircard .meta{color:var(--muted);font-size:13px;font-weight:300;margin-top:4px}
.paircard.right{border-color:var(--mint);background:rgba(95,203,164,.13)}
.paircard.wrong{border-color:var(--clay);background:rgba(212,106,94,.13)}
.paircard:disabled{cursor:default}
.result{text-align:center;padding:26px 0 8px}
.score{font-size:clamp(40px,11vw,60px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.42em;font-weight:400;color:var(--muted)}
.verdict{font-size:18px;font-weight:600;margin-top:12px}
.detail{color:var(--muted);font-size:14px;font-weight:300;margin-top:6px}
.board-list{margin-top:22px;text-align:start;border-top:1px solid var(--line)}
.board-list .li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.board-list .rk{width:22px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.board-list .nm{flex:1}
.board-list .pt{font-weight:600;font-variant-numeric:tabular-nums}
.board-list .li.you,.board-list .li.you .rk{color:var(--gold)}
.note{color:var(--muted);font-size:13px;font-weight:300;margin-top:26px;line-height:1.8}
.note code{background:var(--surface);padding:2px 6px;border-radius:5px;font-size:12px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="mark">UM<span>TUBA</span> World — الألعاب</div>
    <div class="sub">ثلاث ألعاب جديدة على نفس المحرك</div>
  </header>
  <div class="rule"></div>
  <div class="surfaces" role="tablist" aria-label="ألعاب World">
    <button class="surf" role="tab" aria-selected="true" data-g="flag-guess">تخمين العلم</button>
    <button class="surf" role="tab" aria-selected="false" data-g="farther-pair">المسافة بين مدينتين</button>
    <button class="surf" role="tab" aria-selected="false" data-g="larger-country">أي دولة أكبر</button>
  </div>
  <p class="where" id="where"></p>
  <main id="stage"></main>
  <p class="note">
    الأعلام والدول والمدن هون <b>بيانات تجريبية</b> مرسومة بـ SVG داخل الملف.
    نفس النقاط والمؤقّت ولوحة المتصدّرين تبع الدفعة الأولى.
  </p>
</div>
<script>
"use strict";

const UM = (() => {
  const memory = new Map();
  const store = {
    async get(k){ return memory.has(k) ? memory.get(k) : null; },
    async set(k,v){ memory.set(k,v); return v; }
  };
  const strings = {
    ar:{
      score:"النقاط", time:"الوقت", streak:"متتالية", mistakes:"أخطاء",
      question:"سؤال", of:"من", start:"ابدأ", again:"العب مرة ثانية",
      next:"التالي", results:"النتيجة", correct:"إجابة صحيحة",
      wrong:"إجابة خاطئة", timeout:"انتهى الوقت", point:"نقطة",
      leaders:"المتصدّرون", you:"أنت", hint:"تلميح", newGame:"لعبة جديدة",
      solved:"انحلّت", perfect:"علامة كاملة", good:"شغل ممتاز",
      okay:"نتيجة مقبولة", weak:"محتاج مراجعة", left:"باقي",
      round:"جولة", farther:"أبعد زوج", larger:"الدولة الأكبر"
    },
    en:{
      score:"Score", time:"Time", streak:"Streak", mistakes:"Mistakes",
      question:"Question", of:"of", start:"Start", again:"Play again",
      next:"Next", results:"Results", correct:"Correct",
      wrong:"Incorrect", timeout:"Time's up", point:"pt",
      leaders:"Leaderboard", you:"You", hint:"Hint", newGame:"New game",
      solved:"Solved", perfect:"Perfect score", good:"Well done",
      okay:"Decent result", weak:"Needs review", left:"left",
      round:"Round", farther:"Farther pair", larger:"Larger country"
    }
  };
  let lang = "ar";
  const t = k => (strings[lang] && strings[lang][k]) || strings.ar[k] || k;
  const rtl = () => ["ar","fa","ur","he"].includes(lang);
  const num = n => lang === "ar" ? String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]) : String(n);
  const clock = s => num(Math.floor(s/60)) + ":" + num(String(s%60).padStart(2,"0"));
  let ac = null;
  function tone(freq, ms, type="sine", vol=.06){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + ms/1000);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + ms/1000);
    }catch(e){}
  }
  const sfx = {
    ok:   () => { tone(660,90); setTimeout(()=>tone(880,130),75); },
    no:   () => tone(180,200,"square",.05),
    tick: () => tone(440,40,"triangle",.03),
    win:  () => [0,110,220,380].forEach((d,i)=>setTimeout(()=>tone([523,659,784,1047][i],220),d))
  };
  async function submit(gameId, points){
    const key = "lb:" + gameId;
    const rows = (await store.get(key)) || seedBoard(gameId);
    const mine = rows.find(r => r.me);
    if (mine) mine.points = Math.max(mine.points, points);
    else rows.push({ name: t("you"), points, me: true });
    rows.sort((a,b) => b.points - a.points);
    await store.set(key, rows);
    return rows.slice(0, 5);
  }
  function seedBoard(id){
    const pool = ["ليان","مهند","سلمى","يوسف","رنا","كرم","دانا","باسل"];
    return pool.slice(0,5).map((n,i) => ({ name:n, points: 520 - i*(37+i*9) }));
  }
  function timer(seconds, onTick, onEnd){
    let left = seconds, id = null;
    const step = () => { left--; onTick(left); if (left <= 0){ stop(); onEnd(); } };
    const start = () => { stop(); onTick(left); id = setInterval(step, 1000); };
    const stop  = () => { if (id) clearInterval(id); id = null; };
    return { start, stop, get left(){ return left; }, set left(v){ left = v; } };
  }
  function stopwatch(onTick){
    let s = 0, id = null;
    return {
      start(){ this.stop(); id = setInterval(()=>{ s++; onTick(s); },1000); },
      stop(){ if(id) clearInterval(id); id = null; },
      get elapsed(){ return s; }
    };
  }
  function el(tag, cls, html){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  const registry = new Map();
  const register = (id, def) => registry.set(id, def);
  const get = id => registry.get(id);
  const bySurface = s => [...registry.values()].filter(g => g.surface === s);
  return { store, t, num, clock, sfx, submit, timer, stopwatch, el,
           register, get, bySurface, rtl,
           get lang(){ return lang; }, set lang(v){ lang = v; } };
})();

function stat(k,v){
  const n=UM.el("div","stat");
  n.append(UM.el("span","k",k),UM.el("span","v",v));
  return { node:n, set:x=>n.querySelector(".v").textContent=x,
           warn:on=>n.querySelector(".v").classList.toggle("warn",on) };
}
async function board(id,pts){
  const rows=await UM.submit(id,pts), w=UM.el("div","board-list");
  const h=UM.el("div","qnum",UM.t("leaders")); h.style.paddingTop="10px"; w.append(h);
  rows.forEach((r,i)=>{
    const li=UM.el("div","li"+(r.me?" you":""));
    li.append(UM.el("span","rk",UM.num(i+1)),UM.el("span","nm",r.name),
              UM.el("span","pt",UM.num(r.points)));
    w.append(li);
  });
  return w;
}
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const TAGS=["أ","ب","ج","د"];

  { id:"ps", name:"فلسطين", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم فلسطين"><rect width="60" height="13.4" fill="#000"/><rect y="13.3" width="60" height="13.4" fill="#fff"/><rect y="26.6" width="60" height="13.4" fill="#007A3D"/><polygon points="0,0 22,20 0,40" fill="#CE1126"/></svg>' },
  { id:"eg", name:"مصر", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم مصر"><rect width="60" height="13.4" fill="#CE1126"/><rect y="13.3" width="60" height="13.4" fill="#fff"/><rect y="26.6" width="60" height="13.4" fill="#000"/><polygon points="30,16 32,22 28,22" fill="#C09300"/></svg>' },
  { id:"sa", name:"السعودية", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم السعودية"><rect width="60" height="40" fill="#006C35"/><rect x="14" y="18" width="32" height="4" fill="#fff"/><rect x="38" y="14" width="3" height="12" fill="#fff"/></svg>' },
  { id:"ae", name:"الإمارات", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم الإمارات"><rect width="16" height="40" fill="#FF0000"/><rect x="16" width="44" height="13.4" fill="#00732F"/><rect x="16" y="13.3" width="44" height="13.4" fill="#fff"/><rect x="16" y="26.6" width="44" height="13.4" fill="#000"/></svg>' },
  { id:"se", name:"السويد", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم السويد"><rect width="60" height="40" fill="#006AA7"/><rect x="16" width="8" height="40" fill="#FECC00"/><rect y="16" width="60" height="8" fill="#FECC00"/></svg>' },
  { id:"jp2", name:"سويسرا", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم سويسرا"><rect width="60" height="40" fill="#FF0000"/><rect x="26" y="8" width="8" height="24" fill="#fff"/><rect x="18" y="16" width="24" height="8" fill="#fff"/></svg>' },
  { id:"ma", name:"المغرب", svg:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم المغرب"><rect width="60" height="40" fill="#C1272D"/><polygon points="30,12 32.4,19.2 40,19.2 33.8,23.6 36.2,31 30,26.4 23.8,31 26.2,23.6 20,19.2 27.6,19.2" fill="none" stroke="#006233" stroke-width="1.4"/></svg>' }
];
FLAGS[10].id = "ch";

const DIST = {
  "riyadh|jeddah":949,"riyadh|cairo":1970,"riyadh|amman":1580,"riyadh|dubai":870,
  "jeddah|cairo":1220,"cairo|alexandria":180,"cairo|amman":500,"amman|beirut":240,

};
function distOf(a,b){
  const k1=a+"|"+b, k2=b+"|"+a;
  return DIST[k1] || DIST[k2] || 0;
}
function makePairs(){
  const ids=CITIES.map(c=>c.id);
  const pairs=[];
  for(let i=0;i<ids.length;i++){
    for(let j=i+1;j<ids.length;j++){
      const d=distOf(ids[i],ids[j]);
      if(d) pairs.push({a:ids[i],b:ids[j],km:d});
    }
  }
  return pairs;
}

function quizShell(root, timerSec){
  const panel=UM.el("div","panel"), bar=UM.el("div","bar");
  const sc=stat(UM.t("score"),UM.num(0)), st=stat(UM.t("streak"),UM.num(0));
  const tm=stat(UM.t("time"), UM.num(timerSec));
  bar.append(sc.node, st.node, UM.el("div","grow"), tm.node);
  const strand=UM.el("div","strand"), fill=UM.el("i"); strand.append(fill);
  const body=UM.el("div","body");
  panel.append(bar,strand,body); root.append(panel);
  return { panel, body, sc, st, tm, fill, strand };
}

UM.register("flag-guess", {
  title:"تخمين العلم",
  blurb:"علم مرسوم، وأربع دول. اختَر الدولة الصح قبل ما يخلص الوقت.",
  mount(root){
    const ROUNDS=8, QS=18;
    let deck=shuffle(FLAGS).slice(0,ROUNDS), i=0, score=0, streak=0, best=0, right=0, locked=false;
    const ui=quizShell(root, QS);
    const clock=UM.timer(QS, left=>{
      ui.tm.set(UM.num(Math.max(left,0)));
      ui.fill.style.width=((QS-left)/QS*100)+"%";
      ui.fill.classList.toggle("tight", left<=5);
      ui.tm.warn(left<=5);
      if(left<=5 && left>0) UM.sfx.tick();
    }, ()=>answer(-1));

    function draw(){
      locked=false;
      const F=deck[i];
      ui.body.innerHTML="";
      ui.body.append(UM.el("div","qnum", `${UM.t("question")} ${UM.num(i+1)} ${UM.t("of")} ${UM.num(ROUNDS)}`));
      const box=UM.el("div","flagbox"); box.innerHTML=F.svg; ui.body.append(box);
      ui.body.append(UM.el("div","qtext","هذا العلم لأي دولة؟"));
      const wrong=shuffle(FLAGS.filter(x=>x.id!==F.id)).slice(0,3);
      const opts=shuffle([F,...wrong]);
      const list=UM.el("div","choices");
      opts.forEach((o,k)=>{
        const b=UM.el("button","choice"); b.dataset.id=o.id;
        b.append(UM.el("span","tag",TAGS[k]), UM.el("span","",o.name));
        b.onclick=()=>answer(o.id);
        list.append(b);
      });
      ui.body.append(list);
      clock.left=QS; clock.start();
    }
    function answer(pick){
      if(locked) return;
      locked=true; clock.stop();
      const F=deck[i], hit=pick===F.id;
      [...ui.body.querySelectorAll(".choice")].forEach(b=>{
        b.disabled=true;
        if(b.dataset.id===F.id) b.classList.add("right");
        else if(b.dataset.id===pick) b.classList.add("wrong");
      });
      if(hit){
        right++; streak++; best=Math.max(best,streak);
        score += 80 + Math.round(clock.left*2) + Math.min(streak-1,5)*10;
        UM.sfx.ok();
      } else { streak=0; UM.sfx.no(); }
      ui.sc.set(UM.num(score)); ui.st.set(UM.num(streak));
      const w=UM.el("div","why "+(hit?"ok":"no"));
      w.append(UM.el("span","lead", pick===-1?UM.t("timeout"):hit?UM.t("correct"):UM.t("wrong")),
               UM.el("span","", F.name));
      ui.body.append(w);
      const row=UM.el("div","row");
      const nx=UM.el("button","btn go", i+1<ROUNDS?UM.t("next"):UM.t("results"));
      nx.onclick=()=>{ i+1<ROUNDS ? (i++, draw()) : finish(); };
      row.append(nx); ui.body.append(row); nx.focus();
    }
    async function finish(){
      clock.stop();
      const pct=Math.round(right/ROUNDS*100);
      const v=pct===100?UM.t("perfect"):pct>=75?UM.t("good"):pct>=50?UM.t("okay"):UM.t("weak");
      if(pct>=75) UM.sfx.win();
      ui.body.innerHTML="";
      const res=UM.el("div","result");
      res.append(UM.el("div","score",`${UM.num(score)}<small> ${UM.t("point")}</small>`),
                 UM.el("div","verdict",v),
                 UM.el("div","detail",`${UM.num(right)} ${UM.t("of")} ${UM.num(ROUNDS)} · ${UM.t("streak")} ${UM.num(best)}`));
      ui.body.append(res); ui.body.append(await board("flag-guess",score));
      const r=UM.el("div","row"); r.style.justifyContent="center";
      const ag=UM.el("button","btn go",UM.t("again"));
      ag.onclick=()=>{ deck=shuffle(FLAGS).slice(0,ROUNDS); i=0;score=0;streak=0;best=0;right=0;
        ui.sc.set(UM.num(0)); ui.st.set(UM.num(0)); draw(); };
      r.append(ag); ui.body.append(r);
    }
    draw();
    return ()=>clock.stop();
  }
});

UM.register("farther-pair", {
  title:"المسافة بين مدينتين",
  blurb:"زوجان من المدن. أي زوج أبعد عن بعضه؟",
  mount(root){
    const ROUNDS=8, QS=16, ALL=makePairs();
    let i=0, score=0, streak=0, best=0, right=0, locked=false, cur=null;
    const ui=quizShell(root, QS);
    const clock=UM.timer(QS, left=>{
      ui.tm.set(UM.num(Math.max(left,0)));
      ui.fill.style.width=((QS-left)/QS*100)+"%";
      ui.fill.classList.toggle("tight", left<=5);
      ui.tm.warn(left<=5);
      if(left<=5 && left>0) UM.sfx.tick();
    }, ()=>answer(-1));

    function city(id){ return CITIES.find(c=>c.id===id); }
    function label(p){ return city(p.a).city+" — "+city(p.b).city; }
    function nextRound(){
      const pool=shuffle(ALL);
      let a=pool[0], b=null;
      for(const p of pool){
        if(p!==a && Math.abs(p.km-a.km)>=400){ b=p; break; }
      }
      if(!b) b=pool[1];
      return { left:a, right:b, win: a.km>=b.km ? "L" : "R" };
    }
    function draw(){
      locked=false; cur=nextRound();
      ui.body.innerHTML="";
      ui.body.append(UM.el("div","qnum", `${UM.t("question")} ${UM.num(i+1)} ${UM.t("of")} ${UM.num(ROUNDS)}`));
      ui.body.append(UM.el("div","qtext","أي زوج أبعد عن بعضه؟"));
      const grid=UM.el("div","pairgrid");
      [["L",cur.left],["R",cur.right]].forEach(([side,p],k)=>{
        const b=UM.el("button","paircard"); b.dataset.side=side;
        b.append(UM.el("div","who",label(p)),
                 UM.el("div","meta", city(p.a).country+" · "+city(p.b).country));
        b.onclick=()=>answer(side);
        grid.append(b);
      });
      ui.body.append(grid);
      clock.left=QS; clock.start();
    }
    function answer(pick){
      if(locked) return;
      locked=true; clock.stop();
      const hit=pick===cur.win;
      [...ui.body.querySelectorAll(".paircard")].forEach(b=>{
        b.disabled=true;
        if(b.dataset.side===cur.win) b.classList.add("right");
        else if(b.dataset.side===pick) b.classList.add("wrong");
      });
      if(hit){
        right++; streak++; best=Math.max(best,streak);
        score += 90 + Math.round(clock.left*2);
        UM.sfx.ok();
      } else { streak=0; UM.sfx.no(); }
      ui.sc.set(UM.num(score)); ui.st.set(UM.num(streak));
      const far=cur.win==="L"?cur.left:cur.right;
      const near=cur.win==="L"?cur.right:cur.left;
      const w=UM.el("div","why "+(hit?"ok":"no"));
      w.append(UM.el("span","lead", pick===-1?UM.t("timeout"):hit?UM.t("correct"):UM.t("wrong")),
               UM.el("span","", `${label(far)} ≈ ${UM.num(far.km)} كم · ${label(near)} ≈ ${UM.num(near.km)} كم`));
      ui.body.append(w);
      const row=UM.el("div","row");
      const nx=UM.el("button","btn go", i+1<ROUNDS?UM.t("next"):UM.t("results"));
      nx.onclick=()=>{ i+1<ROUNDS ? (i++, draw()) : finish(); };
      row.append(nx); ui.body.append(row); nx.focus();
    }
    async function finish(){
      clock.stop();
      const pct=Math.round(right/ROUNDS*100);
      const v=pct===100?UM.t("perfect"):pct>=75?UM.t("good"):pct>=50?UM.t("okay"):UM.t("weak");
      if(pct>=75) UM.sfx.win();
      ui.body.innerHTML="";
      const res=UM.el("div","result");
      res.append(UM.el("div","score",`${UM.num(score)}<small> ${UM.t("point")}</small>`),
                 UM.el("div","verdict",v),
                 UM.el("div","detail",`${UM.num(right)} ${UM.t("of")} ${UM.num(ROUNDS)} · ${UM.t("streak")} ${UM.num(best)}`));
      ui.body.append(res); ui.body.append(await board("farther-pair",score));
      const r=UM.el("div","row"); r.style.justifyContent="center";
      const ag=UM.el("button","btn go",UM.t("again"));
      ag.onclick=()=>{ i=0;score=0;streak=0;best=0;right=0; ui.sc.set(UM.num(0)); ui.st.set(UM.num(0)); draw(); };
      r.append(ag); ui.body.append(r);
    }
    draw();
    return ()=>clock.stop();
  }
});

(() => {
  const stage=document.getElementById("stage"), where=document.getElementById("where");
  const tabs=[...document.querySelectorAll(".surf")];
  let teardown=null;
  function open(id){
    if(teardown) teardown();
    stage.innerHTML="";
    const g=UM.get(id);
    where.innerHTML=`<b>${g.title}</b> — ${g.blurb}`;
    teardown=g.mount(stage)||null;
    tabs.forEach(b=>b.setAttribute("aria-selected", b.dataset.g===id));
  }
  tabs.forEach(b=>b.onclick=()=>open(b.dataset.g));
  open("flag-guess");
})();
</script>
