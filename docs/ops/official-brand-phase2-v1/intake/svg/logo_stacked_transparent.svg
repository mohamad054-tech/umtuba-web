<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD86A"/>
    <stop offset="0.48" stop-color="#D4AF37"/>
    <stop offset="1" stop-color="#B8860B"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="1500" fill="none"/>
<!-- U -->
<path d="M330 280 L330 650 C330 860 455 980 600 980 C745 980 870 860 870 650 L870 280"
      fill="none" stroke="url(#gold)" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/>
<!-- inner highlight -->
<path d="M375 300 L375 650 C375 820 470 920 600 920 C730 920 825 820 825 650 L825 300"
      fill="none" stroke="#FFE8A0" stroke-opacity=".34" stroke-width="26" stroke-linecap="round"/>
<!-- orbit -->
<path d="M260 860 C390 620 650 470 930 350"
      fill="none" stroke="url(#gold)" stroke-width="38" stroke-linecap="round"/>
<path d="M250 890 C390 650 665 495 945 375"
      fill="none" stroke="#FFE9A8" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/>
<!-- star -->
<g transform="translate(930,350)" filter="url(#glow)">
  <polygon points="0,-70 18,-20 70,0 18,20 0,70 -18,20 -70,0 -18,-20" fill="url(#gold)"/>
</g>
<!-- wordmark -->
<text x="600" y="1190" text-anchor="middle" font-family="Montserrat,Arial,sans-serif"
      font-size="150" font-weight="700" letter-spacing="12" fill="#D4AF37">UMTUBA</text>
<text x="600" y="1295" text-anchor="middle" font-family="Montserrat,Arial,sans-serif"
      font-size="44" font-weight="500" letter-spacing="12" fill="#D4AF37">LEARN · CREATE · SHARE</text>
</svg>